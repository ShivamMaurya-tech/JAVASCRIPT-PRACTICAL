<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /></head>
<body>
    <section class="container">
<div class="weather-header">
    <form class="weather_search">
<i class="fa-solid fa-magnifying-glass"></i>
    
    <input type="text" class="city_name" placeholder="Search Your City">


</form>

<div class="weather-body">
    <h1 class="weather_city"></h1>
    <p class="weather_date_time"></p>


    <div class="weather_data">

        <p class="weather_forecast"></p>
        <div class="weather_icon"></div>
    </div>
    <p class="weather_temperature"></p>
    <div class="weather_minmax">
        <p class="weather_min"></p>
        <p class="weather_max"></p>
    </div>
    
    </div>


    

    <section class="weather_info">
  <!-- first section -->
<div class="weather_card">
  <i class="fa-sharp fa-solid fa-temperature-empty"></i>
 <div>
<p>Feels Like</p>
<p class="weather_feelslike">15&#176</p>

 </div>

</div>



<!-- second section
  -->
<div class="weather_card">
  <i class="fa-solid fa-wind"></i>
 <div>
<p>wind</p>
<p class="weather_wind">15&#176</p>

 </div>

</div>


 <!-- third section -->


<div class="weather_card">
  <i class="fa-solid fa-droplet"></i>
 <div>
<p>Humidity</p>
<p class="weather_humidity">15&#176</p>

 </div>

</div>


<!-- fourth section -->



<div class="weather_card">
  <i class="fa-solid fa-gauge-high"></i>
 <div>
<p>Pressure</p>
<p class="weather_pressure">15&#176</p>

 </div>

</div>

    </section>





</div>
        
    </section>



    <script src="script.js"></script>
</body>
</html>
